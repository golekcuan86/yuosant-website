<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
<title id="title">Yuosant optical crystal portal</title><desc id="desc">A faceted transparent blue crystal with cyan and gold reflections surrounding the original Yuosant emblem.</desc>
<defs>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8ffff" stop-opacity=".86"/><stop offset=".2" stop-color="#31dfff" stop-opacity=".24"/><stop offset=".49" stop-color="#087ac5" stop-opacity=".12"/><stop offset=".7" stop-color="#ffd37b" stop-opacity=".32"/><stop offset="1" stop-color="#e9ffff" stop-opacity=".5"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9ffff" stop-opacity=".8"/><stop offset=".28" stop-color="#00bfff" stop-opacity=".28"/><stop offset=".7" stop-color="#0055a8" stop-opacity=".16"/><stop offset="1" stop-color="#70eaff" stop-opacity=".64"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7c7" stop-opacity=".92"/><stop offset=".5" stop-color="#ffc34c" stop-opacity=".3"/><stop offset="1" stop-color="#ffdf88" stop-opacity=".08"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#00cfff" stop-opacity=".35"/><stop offset="1" stop-color="#00cfff" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
