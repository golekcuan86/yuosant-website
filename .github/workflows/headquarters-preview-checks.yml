name: Yuosant Headquarters Preview QA
on:
  push:
    branches: [redesign-v2, feature/showcase-cinematic-bento]
    paths:
      - "index.html"
      - "headquarters.css"
      - "headquarters.js"
      - "showcase-bento.*"
      - "assets/showcase/cinematic-bento/**"
      - "assets/brand/**"
      - "tests/headquarters.smoke.mjs"
      - "tests/headquarters.browser.mjs"
      - ".github/workflows/headquarters-preview-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Static integration and JavaScript syntax checks
        run: |
          node --check headquarters.js
          node --check showcase-bento.js
          node --test tests/headquarters.smoke.mjs
      - name: Install browser test library
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Desktop and mobile Chromium checks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/yuosant-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          node tests/headquarters.browser.mjs
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yuosant-visual-review
          path: |
            headquarters-desktop.png
            headquarters-mobile.png
          if-no-files-found: warn
          retention-days: 7
